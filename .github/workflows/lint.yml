name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          for f in bin/*.sh etc/*.sh utils/*.sh lib/*.sh collectors/*.sh plugins/*/*/*.sh tests/*.sh mysql/*.sh postgres/*.sh; do
            bash -n "$f" || exit 1
          done

      - name: ShellCheck (errors only)
        run: shellcheck -S error -s bash bin/*.sh etc/*.sh utils/*.sh lib/*.sh collectors/*.sh plugins/*/*/*.sh tests/*.sh mysql/*.sh postgres/*.sh

      - name: PHP syntax check
        run: |
          for f in www/php/*.php mysql/*.php utils/*.php; do
            php -l "$f" || exit 1
          done

      - name: Plugin runner tests
        run: bash tests/drsm_run_test.sh

  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["7.2", "8.3"]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: PHP ${{ matrix.php }} syntax check
        run: |
          for f in www/php/*.php mysql/*.php utils/*.php; do
            php -l "$f" || exit 1
          done

      - name: JavaScript syntax check
        run: node --check www/js/drsm.js

      - name: Web page tests
        run: bash tests/www_test.sh

      - name: Login tests
        run: bash tests/auth_test.sh
