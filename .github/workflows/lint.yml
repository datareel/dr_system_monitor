name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          for f in bin/*.sh etc/*.sh utils/*.sh mysql/*.sh postgres/*.sh; do
            bash -n "$f" || exit 1
          done

      - name: ShellCheck (errors only)
        run: shellcheck -S error -s bash bin/*.sh etc/*.sh utils/*.sh mysql/*.sh postgres/*.sh

      - name: PHP syntax check
        run: |
          for f in www/php/*.php mysql/*.php; do
            php -l "$f" || exit 1
          done
