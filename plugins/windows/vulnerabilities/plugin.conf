# DRSM plugin manifest, see PLUGINS.md
NAME=vulnerabilities
CATEGORY=windows
DESCRIPTION="Security updates (MSRC severity, CVEs) the host still needs, from the agent's Windows Update scan"
PLATFORMS="windows"
MODE=remote
TIMEOUT=60
REQUIRES="awk"
NEEDS_SUDO=no

# Settings, override per host with windows_vulnerabilities_<SETTING>=value
# Security updates at or above this severity are an error:
# Critical, Important, Moderate, Low, or none
CRIT_SEVERITY=Critical
# Security updates at or above this severity are a warning
WARN_SEVERITY=Important
# Severity used for alerts on security updates Microsoft did not rate.
# Windows Update leaves MsrcSeverity empty on some security updates
# (.NET, Windows Insider builds); none = never alert on them
UNRATED_SEVERITY=Important
# Days since the last scan before a warning
SCAN_MAX_AGE_DAYS=3
# The same for scans run by hand (agent [scan] enabled=0), 0 = never warn
MANUAL_SCAN_MAX_AGE_DAYS=0
# Most updates listed for the Vulnerabilities page
MAX_LIST=300
