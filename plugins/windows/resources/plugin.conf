# DRSM plugin manifest, see PLUGINS.md
NAME=resources
CATEGORY=windows
DESCRIPTION="CPU, memory, disk space and network use from the Windows agent report"
PLATFORMS="windows"
MODE=remote
TIMEOUT=30
REQUIRES="awk"
NEEDS_SUDO=no

# Settings, override per host with windows_resources_<SETTING>=value
# CPU used percent warning and error levels. The agent samples for 5
# seconds when it writes the report.
CPU_WARN=85
CPU_CRIT=95
# Available memory in MB at or below this is an error
MIN_AVAIL_MB=256
# Commit charge (memory plus page file) percent of the commit limit
# before a warning
COMMIT_WARN=90
# Disk space used percent warning and error levels, per fixed drive
DISK_WARN=90
DISK_CRIT=99
# Space separated drives to skip, for example "D: E:"
DISK_SKIP=
# Days since the last restart before a warning, 0 to skip. Windows
# needs a restart to finish most updates.
UPTIME_WARN_DAYS=0
# Hours a report can be old before its values are not checked, so a
# laptop that is off does not keep alerting on old numbers.
# windows/checkin reports the old report itself.
MAX_AGE_HOURS=2
