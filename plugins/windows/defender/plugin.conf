# DRSM plugin manifest, see PLUGINS.md
NAME=defender
CATEGORY=windows
DESCRIPTION="Microsoft Defender threats, protection turned off, old definitions"
PLATFORMS="windows"
MODE=remote
TIMEOUT=30
REQUIRES="awk"
NEEDS_SUDO=no

# Settings, override per host with windows_defender_<SETTING>=value
# Days of events to alert on. The agent sends event_lookback_days
# (default 30) of events, older ones here are listed but do not alert.
LOOKBACK_DAYS=7
# Defender event IDs that are errors: threat found (1006, 1015, 1116),
# remediation failed (1118, 1119), real-time protection or scanning
# turned off (5001, 5010, 5012)
CRIT_EVENTS="1006 1015 1116 1118 1119 5001 5010 5012"
# Event IDs that are warnings: threat removed (1117), update failures
# (2001, 2003, 2004), protection feature failure (3002), engine
# stopped (5008)
WARN_EVENTS="1117 2001 2003 2004 3002 5008"
# Days since the last Security Intelligence update before a warning,
# 0 to skip. Read from the patch history in the report.
DEFINITIONS_WARN_DAYS=7
