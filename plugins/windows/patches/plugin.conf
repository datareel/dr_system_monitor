# DRSM plugin manifest, see PLUGINS.md
NAME=patches
CATEGORY=windows
DESCRIPTION="Windows Update installed patches recently"
PLATFORMS="windows"
MODE=remote
TIMEOUT=30
REQUIRES="awk"
NEEDS_SUDO=no

# Settings, override per host with windows_patches_<SETTING>=value
# Days since the newest Windows patch before a warning and an error.
# Monthly updates come out on the second Tuesday, so 45 days means a
# month was missed.
WARN_DAYS=45
CRIT_DAYS=90
# Extended regular expression for patch titles that do not count,
# such as the daily Defender definition updates
IGNORE="Security Intelligence Update|Definition Update|Malicious Software Removal Tool"
