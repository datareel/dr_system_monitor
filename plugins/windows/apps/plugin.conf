# DRSM plugin manifest, see PLUGINS.md
NAME=apps
CATEGORY=windows
DESCRIPTION="Required programs are installed and forbidden ones are not"
PLATFORMS="windows"
MODE=remote
TIMEOUT=30
REQUIRES="awk"
NEEDS_SUDO=no

# Settings, override per host with windows_apps_<SETTING>=value
# Program names are matched against the Name: field of ALL INSTALLED
# PROGRAMS, case insensitive, as extended regular expressions.
# Separate entries with a semicolon because names contain spaces, for
# example "Microsoft Defender;Mozilla Firefox". NONE for no list.
# Missing required programs are errors
REQUIRED=NONE
# Installed forbidden programs are errors
FORBIDDEN=NONE
# Installed programs that are warnings
WARN=NONE
