# DRSM plugin manifest, see PLUGINS.md
NAME=checkin
CATEGORY=windows
DESCRIPTION="DataReel Reporting Agent sent a recent, complete report"
PLATFORMS="windows"
MODE=remote
TIMEOUT=30
REQUIRES="awk"
NEEDS_SUDO=no

# Settings, override per host with windows_checkin_<SETTING>=value
# Hours without a report before a warning, a laptop that is off for
# a weekend stays below this
WARN_HOURS=48
# Days without a report before an error
CRIT_DAYS=15
# Lowest agent version that does not warn, empty for any version
MIN_VERSION=
