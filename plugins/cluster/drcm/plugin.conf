# DRSM plugin manifest, see PLUGINS.md
NAME=drcm
CATEGORY=cluster
DESCRIPTION="DataReel Cluster Manager (DRCM) nodes, resources, keep alives, cluster links and failover events"
PLATFORMS="linux"
MODE=remote
TIMEOUT=60
REQUIRES="awk"
# The monitor account needs read access to the cluster auth key for
# drcm_server --client: add it to the group that owns /etc/drcm/.auth
NEEDS_SUDO=no

# Settings, override per host with cluster_drcm_<SETTING>=value
# Cluster config and server binary
CM_CONFIG=/etc/drcm/cm.cfg
DRCM_SERVER=/usr/sbin/drcm_server
# systemd unit of the cluster server, NONE to skip the check
SERVICE=drcm_server
# systemd units that carry cluster traffic, such as an SSH tunnel
TUNNEL_SERVICES=NONE
# Connect to every peer's keep_alive_ip and tcpport, no to skip
LINK_CHECK=yes
LINK_TIMEOUT=5
# Seconds to wait for drcm_server --client --command=cm_stat
STAT_TIMEOUT=30
# Cluster log, empty reads log_dir and logfile from CM_CONFIG
LOG_FILE=
# Minutes of cluster log read for events, at least the cron interval
EVENT_MINUTES=30
# Missed keep alives in EVENT_MINUTES for a warning
KEEPALIVE_WARN=3
# Seconds without an "is alive" log line from an Up peer for a warning
KEEPALIVE_STALE=300
# State of a resource running on its backup node: WARNING or ERROR
FAILOVER_STATE=WARNING
# Name on the Clusters page, empty joins the node names with +
CLUSTER_NAME=
# Minutes counted for the per peer keep alive metrics, the cron interval
INTERVAL_MINUTES=15
# Keep alive timeline on the Clusters page: hours and seconds per step
STRIP_HOURS=24
STRIP_STEP=300
# On Linux agent hosts (COLLECTOR=lra) this check runs on the node as
# the agent's report hook of this name (utils/lra_hook_bundle.sh
# cluster/drcm), and DRSM shows the hook's output. NONE = run here.
LRA_HOOK=drcm
