# DRSM plugin manifest, see PLUGINS.md "Hook uploads"
NAME=backup_job
CATEGORY=uploads
DESCRIPTION="Result of the nightly backup job, written by the backup script"
PLATFORMS="any"
MODE=probe
TIMEOUT=60
REQUIRES="awk"
NEEDS_SUDO=no

# Read by hook.php on the report server
# The backup script writes DRSM lines (INFO/WARNING/ERROR - ..., and
# DETAIL name=value lines that become values for the rules)
FORMAT=drsm-lines
MAX_BYTES=200000
KEEP_HISTORY=7
MIN_INTERVAL_SECONDS=10

# Settings, override per host with uploads_backup_job_<SETTING>=value
TITLE="Backup job"
PLACE=host-section
DISPLAY=kv
# A missed nightly run shows as old data
MAX_AGE_HOURS=26
CRIT_IF="status != ok"
WARN_IF="duration_minutes > 240"
METRICS="duration_minutes size_gb"
MAX_LINES=500
