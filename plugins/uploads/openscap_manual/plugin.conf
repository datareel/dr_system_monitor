# DRSM plugin manifest, see PLUGINS.md "Hook uploads"
NAME=openscap_manual
CATEGORY=uploads
DESCRIPTION="OpenSCAP compliance scan run by hand and sent with drra submit"
PLATFORMS="any"
MODE=probe
TIMEOUT=60
REQUIRES="awk"
NEEDS_SUDO=no

# Read by hook.php on the report server
# Payload format: drsm-lines, kv-sections, json, csv, xccdf-results,
# text or html
FORMAT=xccdf-results
# Largest payload in bytes, previous payloads kept, seconds between uploads
MAX_BYTES=20000000
KEEP_HISTORY=5
MIN_INTERVAL_SECONDS=10

# Settings, override per host with uploads_openscap_manual_<SETTING>=value
TITLE="Manual OpenSCAP scan"
# Where it shows: host-section (the Checks panel of the host page)
PLACE=host-section
# How it shows: table, kv, text, html, or a site display plug-in
DISPLAY=table
# Manual scans: a warning when the last one is over 30 days old
MAX_AGE_HOURS=720
CRIT_IF="fail_critical > 0"
WARN_IF="fail_high > 0"
METRICS="fail fail_high score"
MAX_LINES=2000
