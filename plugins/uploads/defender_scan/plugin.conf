# DRSM plugin manifest, see PLUGINS.md "Hook uploads"
NAME=defender_scan
CATEGORY=uploads
DESCRIPTION="Windows Defender threat history exported to CSV and sent with drra_svc.exe submit"
PLATFORMS="any"
MODE=probe
TIMEOUT=60
REQUIRES="awk"
NEEDS_SUDO=no

# Read by hook.php on the report server
# A CSV with a header row, for example from PowerShell:
#   Get-MpThreatDetection | Select-Object InitialDetectionTime,ThreatID,ActionSuccess,Resources |
#     Export-Csv -NoTypeInformation threats.csv
FORMAT=csv
MAX_BYTES=5000000
KEEP_HISTORY=5
MIN_INTERVAL_SECONDS=10

# Settings, override per host with uploads_defender_scan_<SETTING>=value
TITLE="Defender threat history"
PLACE=host-section
DISPLAY=table
# A scan run by hand: a warning when the last one is over 30 days old
MAX_AGE_HOURS=720
# Any threat row is a warning
WARN_IF="rows > 0"
METRICS="rows"
MAX_LINES=1000
