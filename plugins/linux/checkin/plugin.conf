# DRSM plugin manifest, see PLUGINS.md
NAME=checkin
CATEGORY=linux
DESCRIPTION="DataReel Reporting Agent for Linux sent a recent, complete report"
PLATFORMS="linux"
MODE=remote
TIMEOUT=30
REQUIRES="awk"
NEEDS_SUDO=no

# Settings, override per host with linux_checkin_<SETTING>=value
# The agent reports every 15 minutes. Minutes without a report before
# a warning, and hours before an error.
WARN_MINUTES=60
CRIT_HOURS=24
# Lowest agent version that does not warn, empty for any version
MIN_VERSION=
