# DRSM plugin manifest, see PLUGINS.md
NAME=hooks
CATEGORY=linux
DESCRIPTION="Report hooks: the site checks the Linux agent runs from /etc/drra/report.d"
PLATFORMS="linux"
MODE=remote
TIMEOUT=30
REQUIRES="awk"
NEEDS_SUDO=no

# Settings, override per host with linux_hooks_<SETTING>=value
# Hooks to leave out, such as those a plugin with LRA_HOOK already
# shows (cluster/drcm shows drcm). Space separated, NONE = show all.
SKIP=NONE
# 1 = a host whose report has no hooks is OK, 0 = UNKNOWN
NONE_OK=1
