# DRSM plugin manifest, see PLUGINS.md
NAME=vulnerabilities
CATEGORY=linux
DESCRIPTION="Security advisories (CVEs) that apply to the host, from the agent's OpenSCAP, CSAF/VEX or dnf scan"
PLATFORMS="linux"
MODE=remote
TIMEOUT=60
REQUIRES="awk"
NEEDS_SUDO=no

# Settings, override per host with linux_vulnerabilities_<SETTING>=value
# Advisories at or above this severity are an error:
# Critical, Important, Moderate, Low, or none
CRIT_SEVERITY=Critical
# Advisories at or above this severity are a warning
WARN_SEVERITY=Important
# CVEs with no fix yet (CSAF/VEX scans) at or above this severity are a
# warning, none = never
UNFIXED_WARN_SEVERITY=Critical
# Days since the last scan before a warning
SCAN_MAX_AGE_DAYS=3
# The same for scans run by hand (agent [scan] enabled=0), 0 = never warn
MANUAL_SCAN_MAX_AGE_DAYS=0
# Compliance score (0-100) below which is a warning, empty = no check
COMPLIANCE_MIN_SCORE=
# Most advisories listed for the Vulnerabilities page
MAX_LIST=300
