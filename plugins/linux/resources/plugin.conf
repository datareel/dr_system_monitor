# DRSM plugin manifest, see PLUGINS.md
NAME=resources
CATEGORY=linux
DESCRIPTION="CPU, load, memory, swap, disk space and network use from the Linux agent report"
PLATFORMS="linux"
MODE=remote
TIMEOUT=30
REQUIRES="awk"
NEEDS_SUDO=no

# Settings, override per host with linux_resources_<SETTING>=value
CPU_WARN=85
CPU_CRIT=95
# 15 minute load average per CPU before a warning
LOAD_WARN_PER_CPU=2
# Available memory in MB at or below which is an error
MIN_AVAIL_MB=256
SWAP_WARN=80
DISK_WARN=90
DISK_CRIT=99
INODE_WARN=90
# Mount points to skip, space separated, for example "/boot/efi /mnt/iso"
DISK_SKIP=
# Days up before a warning that updates may be waiting for a restart, 0 = off
UPTIME_WARN_DAYS=0
# A report older than this is not checked, see linux/checkin
MAX_AGE_HOURS=2
