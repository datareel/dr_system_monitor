# DRSM plugin manifest, see PLUGINS.md
NAME=security
CATEGORY=linux
DESCRIPTION="SELinux, firewall, auditd and SSH settings, failed services"
PLATFORMS="linux"
MODE=remote
TIMEOUT=30
REQUIRES="awk"
NEEDS_SUDO=no

# Settings, override per host with linux_security_<SETTING>=value.
# Each is 1 to warn, 0 to only list it.
# SELinux not enforcing
SELINUX_WARN=1
# No firewalld and no nftables rules
FIREWALL_WARN=1
# auditd not running
AUDITD_WARN=0
# sshd allows root to log in with a password (PermitRootLogin yes)
SSH_ROOT_WARN=1
# sshd allows password logins, for hosts on the internet
SSH_PASSWORD_WARN=0
# Failed systemd units
FAILED_UNITS_WARN=1
# Failed units to ignore, space separated, for example "kdump.service"
FAILED_UNITS_SKIP=
