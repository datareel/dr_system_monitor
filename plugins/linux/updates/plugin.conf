# DRSM plugin manifest, see PLUGINS.md
NAME=updates
CATEGORY=linux
DESCRIPTION="Pending package updates, days since the last update, restart needed"
PLATFORMS="linux"
MODE=remote
TIMEOUT=30
REQUIRES="awk"
NEEDS_SUDO=no

# Settings, override per host with linux_updates_<SETTING>=value
# Days since a package was last installed or updated before a warning
WARN_DAYS=45
# Pending updates before a warning, 0 = never warn on the count
PENDING_WARN=0
# 1 = warn when a newer kernel waits for a restart
REBOOT_WARN=1
