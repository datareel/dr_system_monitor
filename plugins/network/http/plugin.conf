# DRSM plugin manifest, see PLUGINS.md
NAME=http
CATEGORY=network
DESCRIPTION="HTTP service answers on the host"
PLATFORMS="any"
MODE=probe
TIMEOUT=120
REQUIRES="curl"
NEEDS_SUDO=no

# Settings, override per host with network_http_<SETTING>=value
# URL to test, empty means http://<host>
URL=
# yes: pass when port 80 is closed but https://<host> answers (any
# certificate), for web servers that only serve HTTPS. Only with URL empty.
HTTPS_FALLBACK=no
CONNECT_TIMEOUT=15
MAX_TIME=30
RETRIES=2
