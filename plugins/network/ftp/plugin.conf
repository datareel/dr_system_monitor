# DRSM plugin manifest, see PLUGINS.md
NAME=ftp
CATEGORY=network
DESCRIPTION="FTP service answers on the host"
PLATFORMS="any"
MODE=probe
TIMEOUT=120
REQUIRES="curl"
NEEDS_SUDO=no

# Settings, override per host with network_ftp_<SETTING>=value
# URL to test, empty means ftp://<host>
URL=
CONNECT_TIMEOUT=15
MAX_TIME=30
RETRIES=2
