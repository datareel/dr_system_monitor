# DRSM plugin manifest, see PLUGINS.md
NAME=nics
CATEGORY=network
DESCRIPTION="Network interface errors, drops and collisions during a sample window"
PLATFORMS="linux"
MODE=remote
TIMEOUT=30
REQUIRES="awk"
NEEDS_SUDO=no

# Settings, override per host with network_nics_<SETTING>=value
# Space separated interfaces to check, empty means all active
# physical interfaces
NICS=
# Alert levels, counted during the sample window
MAX_DROPPED=1000
MAX_COLLISIONS=100
MAX_ERRORS=100
SAMPLE_SECS=5
