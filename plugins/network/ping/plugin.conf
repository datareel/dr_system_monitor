# DRSM plugin manifest, see PLUGINS.md
NAME=ping
CATEGORY=network
DESCRIPTION="Host answers ping from the monitor host"
PLATFORMS="any"
MODE=probe
TIMEOUT=45
REQUIRES="ping"
NEEDS_SUDO=no

# Settings, override per host with network_ping_<SETTING>=value
# Packets to send and the deadline in seconds, any reply passes
COUNT=3
DEADLINE=30
