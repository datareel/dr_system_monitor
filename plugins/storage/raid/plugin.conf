# DRSM plugin manifest, see PLUGINS.md
NAME=raid
CATEGORY=storage
DESCRIPTION="Linux software RAID (mdadm) and LSI MegaRAID drive state"
PLATFORMS="linux"
MODE=remote
TIMEOUT=60
REQUIRES=
# Only the LSI check needs sudo, for the MegaCli64 binary
NEEDS_SUDO=optional

# Settings, override per host with storage_raid_<SETTING>=value
# Path of the LSI MegaCli utility
MEGACLI=/opt/MegaRAID/MegaCli/MegaCli64
# Read software RAID state from another file, for testing
MDSTAT_FILE=/proc/mdstat
