# DRSM plugin manifest, see PLUGINS.md
NAME=diskio
CATEGORY=storage
DESCRIPTION="Disk read and write operations and bytes, for IOPS and throughput trends"
PLATFORMS="linux"
MODE=remote
TIMEOUT=30
REQUIRES="awk"
NEEDS_SUDO=no

# Settings, override per host with storage_diskio_<SETTING>=value
# Disks to report, for example "nvme0n1 nvme1n1". Empty means every
# whole disk (nvme, sd, vd, xvd, hd, mmcblk).
DEVICES=
# Seconds for the current rate sample
SAMPLE_SECS=5
