# DRSM plugin manifest, see PLUGINS.md
NAME=disk
CATEGORY=storage
DESCRIPTION="Space and inode usage on every mounted local file system"
PLATFORMS="linux"
MODE=remote
TIMEOUT=30
REQUIRES="df"
NEEDS_SUDO=no

# Settings, override per host with storage_disk_<SETTING>=value
# Warning and error levels in percent, used for space and inodes
WARN=90
CRIT=99
# Space separated mount points to skip, for example "/archive /usr1"
SKIP=
# Local file system types to check
FSTYPES="xfs ext2 ext3 ext4 btrfs zfs f2fs jfs reiserfs"
