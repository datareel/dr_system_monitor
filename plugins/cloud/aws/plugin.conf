# DRSM plugin manifest, see PLUGINS.md
NAME=aws
CATEGORY=cloud
DESCRIPTION="AWS EC2 instance type, zone and EBS volume sizes from instance metadata"
PLATFORMS="linux"
MODE=remote
TIMEOUT=30
REQUIRES="curl"
NEEDS_SUDO=no

# Settings, override per host with cloud_aws_<SETTING>=value
# Instance metadata service address and the timeout for each request
IMDS_URL=http://169.254.169.254
HTTP_TIMEOUT=3
