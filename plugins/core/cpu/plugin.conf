# DRSM plugin manifest, see PLUGINS.md
NAME=cpu
CATEGORY=core
DESCRIPTION="Current CPU usage, steal time, top processes and CPU temperatures"
PLATFORMS="linux"
MODE=remote
TIMEOUT=30
REQUIRES="ps awk"
NEEDS_SUDO=no

# Settings, override per host with core_cpu_<SETTING>=value
# Warning and error levels for total CPU usage in percent
WARN=85
CRIT=95
# Number of processes to list
NUMPROCS=100
# Seconds between the two /proc/stat samples
SAMPLE_SECS=2
# Report CPU temperatures when lm_sensors is installed, yes or no
TEMPS=yes
