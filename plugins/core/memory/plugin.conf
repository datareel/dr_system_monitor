# DRSM plugin manifest, see PLUGINS.md
NAME=memory
CATEGORY=core
DESCRIPTION="Available memory, swap use and top processes"
PLATFORMS="linux"
MODE=remote
TIMEOUT=15
REQUIRES="ps awk"
NEEDS_SUDO=no

# Settings, override per host with core_memory_<SETTING>=value
# Error when available memory is at or below this many MB
MIN_AVAIL_MB=256
# Warning when this many MB of swap or more is in use
SWAP_WARN_MB=1024
# Number of processes to list
NUMPROCS=100
