# DRSM plugin manifest, see PLUGINS.md
NAME=load
CATEGORY=core
DESCRIPTION="15 minute load average against the CPU count"
PLATFORMS="linux"
MODE=remote
TIMEOUT=15
REQUIRES="awk"
NEEDS_SUDO=no

# Settings, override per host with core_load_<SETTING>=value
# Warning and error levels for the 15 minute load average. Empty
# means scale with the CPU count, a warning at 2x and an error at 4x.
WARN=
CRIT=
