# DRSM plugin manifest, see PLUGINS.md
NAME=users
CATEGORY=core
DESCRIPTION="Logged in users, with alerts for listed user names"
PLATFORMS="linux"
MODE=remote
TIMEOUT=15
REQUIRES="who"
NEEDS_SUDO=no

# Settings, override per host with core_users_<SETTING>=value
# Space separated user names. ERROR_USERS raises an error and
# WARN_USERS a warning when any of them is logged in.
ERROR_USERS=
WARN_USERS=
